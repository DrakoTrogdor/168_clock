[package]
name = "week-clock"
version = "0.1.0"
edition = "2021"

# The app lives in the library so Android can build it as a `cdylib` (whose
# `android_main` is the entry point); desktop builds the thin binary below.
[lib]
name = "weekclock"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[[bin]]
name = "week-clock"
path = "src/main.rs"

[dependencies]
winit = "0.29"
wgpu = "0.20"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
chrono = "0.4"
png = "0.17" # decode the embedded window icon at runtime

# Only needed on Windows, to read the HWND for window shaping.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

# Android: enable winit's NativeActivity backend (provides the android_main glue).
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.29", features = ["android-native-activity"] }

# Embeds assets/icon.ico into the .exe (Explorer / taskbar icon).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Used by `cargo bundle` to build a macOS .app (and .deb/.msi) with the icon.
[package.metadata.bundle]
name = "168-Hour Week Clock"
identifier = "io.github.drakotrogdor.week-clock"
icon = ["assets/icon.icns", "assets/icon.png"]

# Used by `cargo apk` to build the Android APK (full-screen NativeActivity).
[package.metadata.android]
package = "io.github.drakotrogdor.weekclock"
build_targets = ["aarch64-linux-android"]
resources = "assets/android-res"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 33

[package.metadata.android.application]
label = "Week Clock"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[profile.release]
opt-level = 3

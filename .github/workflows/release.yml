name: Release

# Push a semver tag (e.g. `git tag v0.1.1 && git push origin v0.1.1`) to build
# the native binaries on each OS and publish them to a GitHub Release. Windows
# and Linux ship a plain binary; macOS ships a zipped .app bundle so it carries
# the icon (winit can't set a macOS window icon).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: week-clock-linux-x86_64
            bin: week-clock
          - os: windows-latest
            artifact: week-clock-windows-x86_64.exe
            bin: week-clock.exe
          - os: macos-latest
            artifact: week-clock-macos-arm64.app.zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --verbose

      # Windows / Linux: ship the plain binary (the Windows .exe has its icon
      # embedded as a resource; the Linux binary sets its icon at runtime).
      - name: Stage binary
        if: runner.os != 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.bin }}" "dist/${{ matrix.artifact }}"

      # macOS: assemble a .app bundle around the binary (icon + Info.plist) and
      # zip it with ditto so it stays a valid bundle.
      - name: Stage macOS .app
        if: runner.os == 'macOS'
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="dist/168-Hour Week Clock.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/week-clock "$app/Contents/MacOS/week-clock"
          chmod +x "$app/Contents/MacOS/week-clock"
          cp assets/icon.icns "$app/Contents/Resources/icon.icns"
          sed "s/VERSION_PLACEHOLDER/${version}/g" assets/Info.plist > "$app/Contents/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${{ matrix.artifact }}"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          generate_release_notes: true

  # Android: an optimized release APK, signed with the project's stable keystore
  # (stored as the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD repo
  # secrets) so successive releases install over each other.
  android:
    name: Release (Android APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-apk
        run: cargo install cargo-apk

      - name: Install Android SDK platform 33
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" >/dev/null

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"; exit 1
          fi
          # Decode the keystore from the secret into a temp file (never committed).
          ks="$RUNNER_TEMP/weekclock-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$ks"
          echo "keystore: $(stat -c%s "$ks") bytes"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          export CARGO_APK_RELEASE_KEYSTORE="$ks"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          cargo apk build --lib --release

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p dist
          # cargo-apk emits more than one .apk; the final signed one is
          # named after the lib (weekclock.apk).
          apk=$(find target/release -name weekclock.apk | head -n1)
          echo "staging $apk"
          test -n "$apk"
          cp "$apk" dist/week-clock-android-arm64.apk
          ls -la dist

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/week-clock-android-arm64.apk
          generate_release_notes: true
